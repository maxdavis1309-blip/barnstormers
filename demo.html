<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Barnstormers Modernized</title>
<meta name="description" content="Barnstormers Modernized — interactive marketplace demo. Aircraft, parts, engines, hangars and property.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,420;0,9..144,560;1,9..144,380;1,9..144,480&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Geist+Mono:wght@400;500;600&display=swap">

<style>
/* ============================================================
   Barnstormers Modernized — visual layer v2
   Design language derived from Creative Tim UI
   (github.com/creativetimofficial/ui, MIT) — shadcn/ui base,
   orange brand accent, emerald/amber/red/blue status colors,
   10px radius, pill badges, muted washes, no decorative gradients.
   Business rules unchanged: newest-first, free-vs-paid hierarchy,
   cards reserved for paid placement, 44px targets.
   ============================================================ */
:root{
  --paper:#f8f6f1;            /* page background (muted well) */
  --surface:#ffffff;          /* cards */
  --sunk:#ece7dc;             /* muted */
  --ink:#212428;              /* foreground */
  --ink-2:#43474d;            /* secondary text */
  --ink-3:#5c6167;            /* muted-foreground */
  --rule:#e0dbd0;             /* border */
  --rule-2:#e9e5db;           /* subtle border */

  /* brand accent — Creative Tim orange (token keeps its legacy name) */
  --magenta:#c2351b;          /* orange-600 */
  --magenta-2:#a82c15;        /* orange-700 hover */
  --magenta-wash:#faeeea;--accent-text:#c2351b;     /* orange wash */
  --on-accent:#ffffff;

  --blue:#2563eb;   --blue-wash:#eff6ff;
  --ok:#047857;     --ok-wash:#ecfdf5;
  --caution:#b45309;--caution-wash:#fffbeb;
  --warn:#dc2626;   --warn-wash:#fef2f2;

  --ui:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --cond:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --prose:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --data:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r:10px;--r-lg:14px;--r-full:999px;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(24,24,27,.18);
  --ease:cubic-bezier(.2,.7,.3,1);
}
@media (prefers-color-scheme:dark){
  :root[data-theme="dark"]{
    --paper:#070a12; --surface:#0e1420; --sunk:#141b29;
    --ink:#f4f2ec; --ink-2:#cfd4dd; --ink-3:#9aa2b1;
    --rule:rgba(255,255,255,.10); --rule-2:rgba(255,255,255,.06);
    --magenta:#c2351b; --magenta-2:#e56a50; --magenta-wash:rgba(194,53,27,.16);--accent-text:#e56a50; --on-accent:#ffffff;
    --blue:#60a5fa; --blue-wash:rgba(59,130,246,.14);
    --ok:#34d399; --ok-wash:rgba(16,185,129,.13);
    --caution:#fbbf24; --caution-wash:rgba(245,158,11,.13);
    --warn:#f87171; --warn-wash:rgba(239,68,68,.13);
    --shadow:0 1px 2px rgba(0,0,0,.45);
    --shadow-md:0 1px 2px rgba(0,0,0,.45),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#070a12; --surface:#0e1420; --sunk:#141b29;
  --ink:#f4f2ec; --ink-2:#cfd4dd; --ink-3:#9aa2b1;
  --rule:rgba(255,255,255,.10); --rule-2:rgba(255,255,255,.06);
  --magenta:#c2351b; --magenta-2:#e56a50; --magenta-wash:rgba(194,53,27,.16);--accent-text:#e56a50; --on-accent:#ffffff;
  --blue:#60a5fa; --blue-wash:rgba(59,130,246,.14);
  --ok:#34d399; --ok-wash:rgba(16,185,129,.13);
  --caution:#fbbf24; --caution-wash:rgba(245,158,11,.13);
  --warn:#f87171; --warn-wash:rgba(239,68,68,.13);
  --shadow:0 1px 2px rgba(0,0,0,.45);
  --shadow-md:0 1px 2px rgba(0,0,0,.45),0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}html{scroll-behavior:auto}}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px;border-radius:6px}
img{max-width:100%}
button{font:inherit}

/* ---------- review chrome ---------- */
#reviewbar{position:sticky;top:0;z-index:60;background:#18181b;color:#fafafa;
  display:flex;gap:var(--s2);align-items:center;padding:var(--s2) var(--s3);flex-wrap:wrap;
  font-family:var(--data);font-size:11px;letter-spacing:.04em}
#reviewbar b{font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-right:var(--s2)}
#reviewbar button{background:transparent;border:1px solid rgba(255,255,255,.22);color:inherit;
  font-family:var(--data);font-size:11px;padding:0 12px;min-height:44px;cursor:pointer;border-radius:8px}
#reviewbar button[aria-pressed="true"]{background:#fafafa;color:#18181b;border-color:#fafafa;font-weight:600}
#reviewbar .sp{flex:1}
#reviewbar .gap{width:var(--s3)}
:root[data-mode="client"] #reviewbar{display:none}
#reviewpill{position:fixed;right:12px;bottom:12px;z-index:60;background:#18181b;color:#fafafa;
  border:0;border-radius:var(--r-full);padding:10px 14px;font-family:var(--data);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;opacity:.3;transition:opacity .15s ease}
#reviewpill:hover{opacity:1}
:root[data-mode="client"] #reviewpill{display:block}
#reviewpill[hidden]{display:none!important}
:root[data-view="phone"] #app{max-width:390px;margin:0 auto;border-left:1px solid var(--rule);
  border-right:1px solid var(--rule);min-height:100vh;background:var(--paper)}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--rule);
  transition:box-shadow .2s var(--ease)}
:root[data-view="phone"] .hdr{position:static}
:root[data-scrolled="1"] .hdr{box-shadow:var(--shadow-md)}
.hdr-in{max-width:1240px;margin:0 auto;padding:10px var(--s4);display:flex;gap:var(--s4);align-items:center}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none;min-height:44px}
.brand svg{width:20px;height:20px;color:var(--on-accent);flex:none;background:var(--magenta);
  padding:7px;border-radius:10px;box-sizing:content-box}
.brand .wordmark{font-family:var(--serif);font-style:italic;font-weight:560;font-size:16px;letter-spacing:.01em}
.brand .wordmark small{display:block;font-size:10px;font-weight:500;letter-spacing:.02em;
  color:var(--ink-3);margin-top:-1px;text-transform:none}
.hdr .searchwrap{flex:1;min-width:0;max-width:560px}
.hdr .searchbar{border:1px solid var(--rule);background:var(--paper)}
.hdr .searchbar input{min-height:44px}
.hdr .searchbar button{min-height:44px;background:transparent;color:var(--ink-3);border-left:0}
.hdr .searchbar button:hover{color:var(--ink);background:var(--sunk)}
@media (max-width:860px){.hdr .searchwrap{max-width:none}}
.searchbar{display:flex;background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r);overflow:hidden;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.searchbar:focus-within{border-color:var(--magenta);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--magenta) 18%,transparent)}
.searchbar input{flex:1;min-width:0;min-height:44px;border:0;background:transparent;
  padding:0 var(--s3);font-family:var(--ui);font-size:15px;color:var(--ink)}
.searchbar input:focus{outline:none}
.searchbar input::placeholder{color:var(--ink-3)}
.searchbar button{min-height:44px;min-width:44px;border:0;background:transparent;color:var(--ink-3);
  cursor:pointer;padding:0 var(--s3);display:flex;align-items:center;justify-content:center;gap:6px}
.searchbar button svg{width:17px;height:17px}
.navlinks{display:flex;gap:2px;flex:none}
.navlinks a{min-height:44px;display:inline-flex;align-items:center;padding:0 var(--s3);
  font-size:14px;font-weight:500;color:var(--ink-3);text-decoration:none;border-radius:8px;
  transition:background .15s var(--ease),color .15s var(--ease);position:relative}
.navlinks a:hover{background:var(--sunk);color:var(--ink)}
.navlinks a.on{color:var(--ink);font-weight:600}
.navlinks a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:4px;height:3px;
  border-radius:var(--r-full);background:var(--magenta)}
@media (max-width:860px){.navlinks{display:none}}
.mobnav{display:none;border-top:1px solid var(--rule-2);background:var(--surface)}
@media (max-width:860px){.mobnav{display:flex}}
:root[data-view="phone"] .mobnav{display:flex}
.mobnav a{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:500;color:var(--ink-3);text-decoration:none;position:relative}
.mobnav a.on{color:var(--ink);font-weight:600}
.mobnav a.on::after{content:"";position:absolute;left:22%;right:22%;bottom:5px;height:3px;
  border-radius:var(--r-full);background:var(--magenta)}

/* ---------- page & layout ---------- */
.page{max-width:1240px;margin:0 auto;padding:var(--s4)}
:root[data-view="phone"] .page{padding:var(--s3)}
.cols{display:grid;grid-template-columns:240px minmax(0,1fr) 172px;gap:var(--s4);align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:240px minmax(0,1fr)}.rail{display:none}}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}.facets{display:none}}
:root[data-view="phone"] .cols{grid-template-columns:minmax(0,1fr)}
:root[data-view="phone"] .facets,:root[data-view="phone"] .rail{display:none}

.sechead{display:flex;align-items:baseline;gap:var(--s3);justify-content:space-between;
  margin:0 0 var(--s3);flex-wrap:wrap}
.sechead h2{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0;color:var(--ink);
  display:flex;align-items:center;gap:8px}
.sechead h2::before{content:"";width:7px;height:7px;border-radius:var(--r-full);background:var(--magenta);flex:none}
.sechead .ct{font-family:var(--data);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sechead .seeall{font-size:13.5px;font-weight:500;color:var(--ink-2);text-decoration:none;
  display:inline-flex;align-items:center;min-height:44px;padding:0 var(--s2);margin:0 calc(var(--s2)*-1);border-radius:8px}
.sechead .seeall:hover{color:var(--accent-text)}

/* ---------- stream & rows ---------- */
.stream{border:1px solid var(--rule);background:var(--surface);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s4);cursor:pointer;
  padding:var(--s4);border-bottom:1px solid var(--rule-2);transition:background .15s var(--ease)}
.row:last-child{border-bottom:0}
.row:hover{background:color-mix(in srgb,var(--sunk) 55%,var(--surface))}
.row.free{grid-template-columns:minmax(0,1fr)}
.row.hl{background:color-mix(in srgb,var(--magenta-wash) 65%,var(--surface));
  box-shadow:inset 3px 0 0 var(--magenta)}
.row.hl:hover{background:var(--magenta-wash)}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr)}}
:root[data-view="phone"] .row{grid-template-columns:minmax(0,1fr);padding:var(--s3)}
.thumbs{display:flex;gap:6px;flex:none}
@media (max-width:640px){.thumbs{margin-bottom:var(--s3);overflow-x:auto;padding-bottom:2px}}
:root[data-view="phone"] .thumbs{margin-bottom:var(--s3);overflow-x:auto;padding-bottom:2px}
.ph{width:64px;height:48px;border:1px solid var(--rule);border-radius:8px;display:flex;
  align-items:center;justify-content:center;color:var(--ink-3);flex:none;overflow:hidden}
.ph svg{width:26px;height:26px;opacity:.4}
.ph.more{font-family:var(--data);font-size:11px;color:var(--ink-3);background:transparent;border-style:dashed}
.rhead{display:flex;align-items:baseline;gap:var(--s2) var(--s3);flex-wrap:wrap;margin-bottom:6px}
.rtitle{font-size:15px;font-weight:600;letter-spacing:-.012em;margin:0;line-height:1.3}
.rtitle a{color:var(--ink);text-decoration:none;display:inline-block;padding:11px 0;margin:-11px 0;min-height:44px}
.rtitle a:hover{color:var(--accent-text)}
.rprice{font-family:var(--data);font-size:14px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.rprice.none{color:var(--ink-3);font-weight:400;font-size:12.5px;font-family:var(--ui);font-style:italic}
.rprice.odd{color:var(--ink-3)}
.rphrase{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.rbody{font-size:14px;line-height:1.55;color:var(--ink-2);margin:0 0 var(--s3);max-width:78ch}
.rbody .more{font-size:13px;font-weight:500;color:var(--accent-text);text-decoration:none;
  white-space:nowrap;display:inline-block;min-width:44px;min-height:44px;padding:13px 10px;
  margin:-13px -2px;text-align:center;line-height:18px;border-radius:8px}
.rbody .more:hover{text-decoration:underline}
.rmeta{display:flex;gap:var(--s2) var(--s3);flex-wrap:wrap;align-items:center;
  font-size:12.5px;color:var(--ink-3);line-height:1.4}
.rmeta .dot{color:var(--rule)}
.rmeta b{font-weight:600;color:var(--ink-2)}
.rmeta .loc,.rmeta .date{font-family:var(--data);font-size:11.5px}
.ract{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.kind{font-size:11px;font-weight:500;padding:3px 10px;border:1px solid var(--rule);
  color:var(--ink-2);background:var(--sunk);white-space:nowrap;border-radius:var(--r-full);
  display:inline-flex;align-items:center;gap:6px}
.kind::before{content:"";width:6px;height:6px;border-radius:var(--r-full);background:var(--ink-3);opacity:.6}
.kind.wanted{background:var(--caution-wash);border-color:color-mix(in srgb,var(--caution) 30%,transparent);color:var(--caution)}
.kind.wanted::before{background:var(--caution);opacity:1}

/* ---------- buttons ---------- */
.btn{font-family:var(--ui);font-size:14px;font-weight:500;line-height:1;min-height:44px;min-width:44px;
  padding:0 var(--s4);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:var(--r);
  cursor:pointer;text-decoration:none;box-shadow:var(--shadow);
  transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .06s ease}
.btn:hover{background:var(--sunk)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.btn-pri{background:var(--magenta);border-color:var(--magenta);color:var(--on-accent);font-weight:600}
.btn-pri:hover{background:var(--magenta-2);border-color:var(--magenta-2);color:var(--on-accent)}
.btn-sm{padding:0 var(--s3);font-size:13.5px;color:var(--ink-2);border-color:transparent;
  background:transparent;box-shadow:none;border-radius:8px}
.btn-sm:hover{background:var(--sunk);color:var(--ink)}
.btn[aria-pressed="true"]{color:var(--accent-text);border-color:color-mix(in srgb,var(--magenta) 35%,transparent);
  background:var(--magenta-wash)}
.btn[aria-pressed="true"] svg{fill:currentColor}

/* ---------- chips ---------- */
.chips{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.chipscroll{overflow-x:auto;padding-bottom:var(--s1);-webkit-overflow-scrolling:touch}
.chipscroll .chips{flex-wrap:nowrap}
.chip{font-size:13.5px;font-weight:500;min-height:44px;padding:0 var(--s4);
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);
  color:var(--ink-2);border-radius:var(--r-full);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);
  transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .06s ease}
.chip:hover{background:var(--sunk);color:var(--ink)}
.chip:active{transform:translateY(1px)}
.chip[aria-pressed="true"]{background:var(--magenta);border-color:var(--magenta);color:var(--on-accent);font-weight:600}
.chip .n{font-family:var(--data);font-size:11px;opacity:.72;font-variant-numeric:tabular-nums}
.chip .x{font-family:var(--data);font-size:14px;line-height:1;opacity:.85}

/* ---------- facets ---------- */
.facet{border:1px solid var(--rule);background:var(--surface);margin-bottom:var(--s3);
  border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.facet h4{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);margin:0;padding:var(--s3) var(--s4);border-bottom:1px solid var(--rule-2)}
.facet ul{list-style:none;margin:0;padding:var(--s1) 0}
.facet label{display:flex;align-items:center;gap:var(--s3);min-height:44px;padding:0 var(--s4);
  cursor:pointer;font-size:14px;color:var(--ink-2);transition:background .15s var(--ease)}
.facet label:hover{background:var(--sunk);color:var(--ink)}
.facet input[type=checkbox]{width:16px;height:16px;accent-color:var(--magenta);flex:none;cursor:pointer;border-radius:4px}
.facet .ct{margin-left:auto;font-family:var(--data);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.facet .pr{display:flex;gap:var(--s2);padding:var(--s3) var(--s4)}
.facet .pr input{min-height:44px;width:100%;min-width:0;border:1px solid var(--rule);background:var(--paper);
  padding:0 var(--s3);font-family:var(--data);font-size:13.5px;color:var(--ink);border-radius:8px}
.facet .pr input:focus{outline:none;border-color:var(--magenta);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--magenta) 15%,transparent)}

/* ---------- featured ---------- */
.featband{border:1px solid var(--rule);background:var(--surface);margin-bottom:var(--s4);
  border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.featband > h3{font-size:13px;font-weight:600;letter-spacing:.01em;text-transform:none;
  color:var(--ink);margin:0;padding:var(--s3) var(--s4);border-bottom:1px solid var(--rule-2);
  display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;align-items:baseline}
.featband > h3::before{content:"★ ";color:var(--accent-text)}
.featband > h3 span{font-family:var(--data);font-size:10.5px;letter-spacing:0;color:var(--ink-3);font-weight:400}
.featgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:1px;background:var(--rule-2)}
.feat{color:inherit;background:var(--surface);text-decoration:none;display:flex;flex-direction:column;
  transition:background .15s var(--ease)}
.feat:hover{background:var(--sunk)}
.feat .img{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--ink-3);overflow:hidden}
.feat .img svg{width:44px;height:44px;opacity:.32;transition:opacity .15s var(--ease)}
.feat:hover .img svg{opacity:.5}
.feat .b{display:block;padding:var(--s3)}
.feat .ft{display:block;font-size:13.5px;font-weight:600;color:var(--ink);margin:0 0 3px;line-height:1.3;letter-spacing:-.01em}
.feat .fp{display:block;font-family:var(--data);font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.feat .fm{display:block;font-family:var(--data);font-size:10.5px;color:var(--ink-3);margin:var(--s2) 0 0}
@media (max-width:640px){.featgrid{grid-template-columns:repeat(2,1fr)}}
:root[data-view="phone"] .featgrid{grid-template-columns:repeat(2,1fr)}
.featband.strip .featgrid{display:flex;overflow-x:auto;gap:1px;scroll-snap-type:x proximity}
.featband.strip .feat{flex:0 0 178px;scroll-snap-align:start}
.featband.strip .feat .img{aspect-ratio:16/10}
.featband.strip .featgrid::after{content:"";flex:0 0 var(--s2)}
@media (max-width:640px){
  .featband:not(.strip) .featgrid{display:flex;overflow-x:auto;gap:1px;scroll-snap-type:x proximity}
  .featband:not(.strip) .feat{flex:0 0 160px;scroll-snap-align:start}
  .featband:not(.strip) .feat .img{aspect-ratio:16/10}
  .featband:not(.strip) .feat .b{padding:var(--s2) var(--s3) var(--s3)}
  .featband:not(.strip) .feat .fm{display:none}
  .featband.strip > h3{padding:var(--s2) var(--s3)}
  .featband.strip .feat{flex:0 0 128px}

/* Photo placeholder tone. Deterministic per listing so the stream looks varied rather than
   repeated, and expressed as a color-mix against theme tokens so it follows light/dark. */
function tone(id,i){ const SKIES=[
  "linear-gradient(150deg,#e3ebf5 0%,#f5e8d3 62%,#f2ddba 100%)",   /* dawn */
  "linear-gradient(150deg,#dbe7f2 0%,#ecebe0 70%,#efe4cd 100%)",   /* day */
  "linear-gradient(150deg,#f3e2c4 0%,#eecea2 100%)",               /* golden hour */
  "linear-gradient(150deg,#dcd7e4 0%,#efd7bd 100%)",               /* dusk */
  ]; return SKIES[(id*37+i*61)%4]; }
function tone_unused(id,i){ const h=(id*37+i*61)%12; return `color-mix(in srgb, var(--ink) ${4+h}%, var(--sunk))`; }
const PHOTOS = {   /* sample imagery, disclosed on the homepage */
  0:"assets/skyhawk.jpg",        /* the Sell-page live preview */
  2068778:"assets/c206.jpg",     2068709:"assets/skylane.jpg",
  2067412:"assets/skyhawk.jpg",  2068320:"assets/seneca.jpg",
  2066140:"assets/bonanza.jpg",  2067788:"assets/sr22sunset.jpg",
  2059014:"assets/da40.jpg",     2058220:"assets/da40hangar.jpg",
  2068711:"assets/sr22.jpg",     2068101:"assets/thumb_sr22t.jpg",
  2068700:"assets/hangar.jpg"
};
const GAL = id => PHOTOS[id]
  ? [PHOTOS[id], `assets/g/${id}_1.jpg`, `assets/g/${id}_2.jpg`, `assets/g/${id}_3.jpg`]

function phBox(l,i,cls){
  if(i===0 && PHOTOS[l.id])
    return `<span class="${cls||'ph'} photo"><img src="${PHOTOS[l.id]}" alt="" loading="lazy"></span>`;

}

/* Browse rows clip long copy so a page of listings stays scannable. Free ads are capped at
   100 characters by the product itself, so only paid ads are ever clipped — which keeps the
   paid tier visibly longer than the free tier while removing the wall of text. Full seller
   copy appears on the listing detail page. */
/* Sellers are identified by a slug so advertiser pages get a real, indexable URL
   instead of ?userid=. The listing data already carries everything the page needs. */
/* Registration collects up to three telephone numbers and a "show my number" opt-in.
   Some advertisers publish a number, some only take email — the contact action has to
   reflect that rather than assuming email every time. 555 numbers are placeholders. */
D.forEach(function(l,i){
  const s=l.seller;
  s.showPhone = !!s.company || i%3===0;
  s.phone = s.showPhone ? "(555) 0"+((12+i)%90+10)+"-"+(1000+(i*137)%8999) : null;
});

/* Who the buyer is actually writing to. A wanted ad is a buyer; a brokered aircraft is
   a broker; a ferry-pilot ad is an advertiser offering a service. */
function contactRole(l){
  if(l.kind==="wanted") return "buyer";
  const r=(l.seller.role||"").toLowerCase();
  if(r.indexOf("broker")>-1) return "broker";
  if(r.indexOf("dealer")>-1) return "dealer";
  if(l.kind==="services") return "advertiser";
  return "seller";
}
const contactLabel = l => "Contact " + contactRole(l);

const slug = s => (s.company||s.name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
function sellerOf(id){ const l=D.find(x=>slug(x.seller)===id); return l?l.seller:null; }
function adsBySeller(id){ return D.filter(x=>slug(x.seller)===id); }

const BROWSE_CLIP = 210;
function clip(s){
  if(s.length <= BROWSE_CLIP) return {t:esc(s), cut:false};
  let c = s.slice(0, BROWSE_CLIP);
  c = c.slice(0, Math.max(c.lastIndexOf(" "), BROWSE_CLIP - 24));
  return {t:esc(c.replace(/[,;:.\s]+$/,"")) + "…", cut:true};
}

function matches(l){
  if(F.kinds.size && !F.kinds.has(l.kind)) return false;
  if(F.mfgs.size && !F.mfgs.has(l.mfg)) return false;
  if(F.photos && !l.photos) return false;
  if(F.model && !(l.model||"").toLowerCase().includes(F.model.toLowerCase())) return false;
  if(F.state && l.seller.state !== F.state) return false;
  if(F.pn){
    const pn=(l.specs&&l.specs.partNumber||"")+" "+l.body;
    if(!pn.toLowerCase().includes(F.pn.toLowerCase())) return false;
  }
  if(F.min!=null && (l.price==null || l.price < F.min)) return false;
  if(F.max!=null && (l.price==null || l.price > F.max)) return false;
  if(F.q){
    const h=(l.title+" "+l.body+" "+l.mfg+" "+l.model+" "+l.cat+" "+l.seller.company+" "+loc(l.seller)).toLowerCase();
    if(!F.q.toLowerCase().split(/\s+/).every(t=>h.includes(t))) return false;
  }
  return true;
}
function results(){
  let r = D.filter(matches);
  if(F.sort==="asc")  r=[...r].sort((a,b)=>(a.price==null?Infinity:a.price)-(b.price==null?Infinity:b.price));
  if(F.sort==="desc") r=[...r].sort((a,b)=>(b.price==null?-1:b.price)-(a.price==null?-1:a.price));
  return r;
}
const countFor = (key,val) => D.filter(l=>{
  const s={...F, kinds:new Set(F.kinds), mfgs:new Set(F.mfgs)};
  if(key==="kind") s.kinds=new Set([val]); else s.mfgs=new Set([val]);
  const save=F; F=s; const m=matches(l); F=save; return m;
}).length;

function specBlock(l){
  const sc = SPEC_SCHEMA[l.kind];
  if(!sc || (!sc.always.length && !sc.ifPresent.length)) return "";
  const cells=[];
  sc.always.forEach(([k,label])=>{
    const v=(l.specs||{})[k];
    cells.push(`<div><dt>${label}</dt><dd class="${v?"":"na"}">${v?esc(v):"Not stated"}</dd></div>`);
  });
  sc.ifPresent.forEach(([k,label])=>{
    const v=(l.specs||{})[k];
    if(v) cells.push(`<div><dt>${label}</dt><dd>${esc(v)}</dd></div>`);
  });
  if(!cells.length) return "";
  const blanks = sc.always.filter(([k])=>!(l.specs||{})[k]).length;
  return `
  <section class="panel">
    <h3>Specifications</h3>
    <dl class="specs">${cells.join("")}</dl>
    ${blanks && sc.note ? `<p class="specnote">${IC.alert}<span>${sc.note}</span></p>` : ""}
  </section>`;
}

function trustPanel(l){
  const s=l.seller, li=[];
  if(s.domainMatch && s.site)
    li.push(`<li class="pos">${IC.check}<span><b>Email matches ${esc(s.site)}</b> — the company website on this ad</span></li>`);
  li.push(`<li class="neu">${IC.list}<span><b>${s.listings.toLocaleString()} listing${s.listings===1?"":"s"}</b> posted · <b>${s.active} active</b> now</span></li>`);
  li.push(`<li class="neu">${IC.pin}<span>${s.company?"Business":"Private seller"} in <b>${esc(loc(s))}</b></span></li>`);
  return `
  <section class="panel trust">
    <h3>About this advertiser</h3>
    <ul>${li.join("")}</ul>
    <p class="safety">${IC.info}<span>Barnstormers does not verify sellers or guarantee transactions. <a href="#/">How to buy safely →</a></span></p>
  </section>`;
}

function scrollToPreview(){
  const p = document.getElementById("pvpanel");
  if(p && p.scrollIntoView) p.scrollIntoView({block:"start"});
}
function counterHtml(){
  const n=P.body.length, cap=CAP(), over=n>cap;
  const left = `<span class="${over?"over":""}">${n} / ${cap} characters${over?" — "+(n-cap)+" over":""}</span>`;
  /* The nudge appears as the free limit approaches. It is the moment the upgrade
     decision is actually made, so it names what the money buys. */
  const right = over
    ? `<span class="over">Trim, or upgrade for 600 characters and photographs</span>`
    : (P.tier==="free" && n>60
        ? `<span class="cap">$25 buys 600 characters and 20 photographs</span>`
        : `<span class="cap"></span>`);
  return left + right;
}
function previewHtml(){
  const n = P.body.length;
  /* While no photographs are added, the upgraded preview shows where they will go as
     dashed ghosts — including while the free tier is selected, which is exactly when
     the upgraded panel needs to make the $25 visible without faking content. */
  const ghosts = (P.photos===0) ? `
    <div class="ghosts">
      <span class="ph"></span><span class="ph"></span><span class="ph"></span>
      <span class="ph more">up to 20</span>
    </div>
    <p class="pvnote" style="padding:0 var(--s4) var(--s3);margin:0">Your photographs appear here.</p>` : "";
  return `<div class="pvwrap">
    <div class="pv ${P.tier==='free'?'on':''}"><h4>Free<span>$0</span></h4>
      ${row(previewListing("free"))}
      <p class="pvnote" style="padding:0 var(--s4) var(--s3);margin:0">Complete as it stands — free ads are text-only by design.</p>
    </div>
    <div class="pv ${P.tier!=='free'?'on':''}"><h4>Upgraded<span>$25</span></h4>
      ${row(previewListing("upgraded"))}${ghosts}
    </div>
  </div>
  <p class="pvdh">What $25 adds</p>
  <ul class="pvdelta">
    <li><span><b>600 characters</b> instead of 100${n>100?` — your description already needs it (${n})`:""}</span></li>
    <li><span><b>Up to 20 photographs</b>${P.photos?` — ${P.photos} added`:""}</span></li>
    <li><span><b>Specification &amp; inventory sheet</b>${P.doc?` — ${esc(P.doc)} attached`:""}</span></li>
  </ul>`;
}
function paintPreview(){
  const w=document.getElementById("pvwrap"); if(w) w.innerHTML=previewHtml();
  const c=document.getElementById("counter"); if(c) c.innerHTML=counterHtml();
}
function catPickHtml(){
  const q=(P.catq||"").toLowerCase();
  const list=CATLIST.filter(c=>c.toLowerCase().indexOf(q)>-1).slice(0,40);
  if(!list.length) return `<p class="hint" style="padding:var(--s3)">No category matches "${esc(P.catq)}".</p>`;
  const full=P.cats.length>=MAX_CATS;
  return list.map(c=>{
    const on=P.cats.indexOf(c)>-1;
    return `<button type="button" class="catopt" aria-pressed="${on}" ${(!on&&full)?"disabled":""}
      onclick="toggleCat(${esc(JSON.stringify(c))})">${esc(c)}</button>`;
  }).join("");
}
function paintCats(){
  const el=document.getElementById("catpick");
  if(el) el.innerHTML=catPickHtml();
}
function toggleCat(c){
  const i=P.cats.indexOf(c);
  if(i>-1) P.cats.splice(i,1);
  else if(P.cats.length<MAX_CATS) P.cats.push(c);
  render();
}
function setDoc(){ P.doc = P.doc ? null : "Specs_and_Inventory.pdf"; render(); }
let sellerKind = "";
function setSellerKind(k){ sellerKind = k; render(); }
function renewAd(id){ renewed.add(id); render(); toast("Renewed — back at the top of the listings"); }
function markSold(id){ sold.add(id); render(); toast("Marked sold"); }
function renewExpiring(){
  const before = renewed.size;
  D.filter(l=>slug(l.seller)==="alpine-airparts").slice(0,4)
   .forEach((l,i)=>{ if([3,18,24,11][i]<=5) renewed.add(l.id); });
  const n = renewed.size - before;
  render();
  toast(n ? n+" advertisement"+(n===1?"":"s")+" renewed" : "Nothing expiring within 5 days");
}
function setTier(t){ P.tier=t; if(t==="free"){ P.photos=0; P.doc=null; } render(); }
function addPhotos(){ P.photos=Math.min(20,P.photos+3); render(); }
function setUpgrade(k,on){ P[k]=!!on; render(); }
function postState(){ return P; }

function render(){
  const h = location.hash || "#/";
  const app = document.getElementById("app");
  const m = h.match(/^#\/l\/(\d+)/);
  const sel = h.match(/^#\/seller\/([a-z0-9-]+)/);
  const hg  = h.match(/^#\/hangar(?:\/([a-z]+))?/);
  if(m)                             galIdx = 0;
  if(m)                             app.innerHTML = viewDetail(parseInt(m[1],10));
  else if(sel)                      app.innerHTML = viewSeller(sel[1]);
  else if(hg)                       app.innerHTML = viewHangar(hg[1]);
  else if(h.startsWith("#/search")) app.innerHTML = viewSearch();
  else if(h.startsWith("#/post"))   app.innerHTML = viewPost();
  else if(h.startsWith("#/browse")) app.innerHTML = viewBrowse();
  else                              app.innerHTML = viewBrowse();
  /* Filter changes re-render the whole view, so the sheet has to be reopened
     afterwards — otherwise ticking a box on mobile dismisses the sheet. */
  const sh = document.getElementById("sheet");
  if(sheetOpen && sh) sh.classList.add("open");
  const ss = document.getElementById("sortsheet");
  if(sortOpen && ss) ss.classList.add("open");
  if(navAnim && !sheetOpen && !sortOpen){
    const pg = app.querySelector ? app.querySelector("main") : null;
    if(pg) pg.classList.add("enter");
  }
  navAnim = false;
  if(!sheetOpen && !sortOpen) window.scrollTo(0,0);
  syncButtons();
}

}
function closeContact(){ const b=document.getElementById("contact"); if(b) b.classList.remove("open"); }
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ closeContact(); closeSheet(); closeSort(); return; }
  /* arrow keys page through a listing's photographs — never while typing */
  if(e.key!=="ArrowLeft" && e.key!=="ArrowRight") return;
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName||"")) return;
  if(!/^#\/l\//.test(location.hash)) return;
  const strip = document.querySelectorAll('.gal .strip button[aria-label^="Photograph"]');
  if(!strip.length) return;
  let i = galIdx + (e.key==="ArrowRight" ? 1 : -1);
  i = Math.max(0, Math.min(strip.length-1, i));
  if(i !== galIdx) strip[i].click();
});
/* Every meaningful action confirms itself — the skill library's "success feedback" rule. */
function toast(msg){
  const box = document.getElementById("toastbox");
  if(!box || !box.appendChild) return;
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  box.appendChild(t);
  void t.offsetWidth;            /* force a reflow so the transition runs from the hidden state */
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); setTimeout(function(){ t.remove(); }, 250); }, 2200);
}

function toggleSave(id){
  saved.has(id) ? saved.delete(id) : saved.add(id);
  const on = saved.has(id);
  /* every control bound to this listing updates together — row, sidebar and sticky bar */
  document.querySelectorAll('.js-save[data-id="'+id+'"]').forEach(function(b){
    b.setAttribute("aria-pressed", on);
    const lab = b.querySelector("span[data-on]");
    if(lab) lab.textContent = on ? lab.dataset.on : lab.dataset.off;
  });
  toast(on ? "Saved to your watchlist" : "Removed from your watchlist");
}
function pickPhoto(id,i,btn){
  galIdx = i;
  const l = D.find(x=>x.id===id);
  const main = document.getElementById("galmain");
  const gset = GAL(id);
  if(main){
    main.style.background = tone(id,i);
    main.innerHTML = (gset && gset[i])
      ? `<img src="${gset[i]}" alt="">`
      : kindIcon(l ? l.kind : "aircraft");
  }
  const pos = document.getElementById("galpos");
  if(pos && l) pos.textContent = "Photograph "+(i+1)+" of "+l.photos;
  btn.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-current","false"));
  btn.setAttribute("aria-current","true");
}

/* review chrome */
function setTheme(t){
  const r=document.documentElement;
  t===null ? r.removeAttribute("data-theme") : r.setAttribute("data-theme",t);
  syncButtons();
}
function setView(v){ document.documentElement.setAttribute("data-view",v); syncButtons(); }
const LOCKED = true;
function setMode(m){
  MODE = LOCKED ? "client" : m;
  document.documentElement.setAttribute("data-mode", MODE);
  const pill = document.getElementById("reviewpill");
  if(pill) pill.hidden = LOCKED || MODE !== "client";
  render();
}
function syncButtons(){
  const th = document.documentElement.getAttribute("data-theme") || "sys";
  document.querySelectorAll("#reviewbar [data-th]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.th===th));
  const vw = document.documentElement.getAttribute("data-view") || "wide";
  document.querySelectorAll("#reviewbar [data-vw]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.vw===vw));
  document.querySelectorAll("#reviewbar [data-md]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.md===MODE));
}

window.addEventListener("hashchange", function(){ navAnim = true; render(); });
function paintScrolled(){
  document.documentElement.setAttribute("data-scrolled", window.scrollY > 4 ? "1" : "0");
}
window.addEventListener("scroll", paintScrolled, {passive:true});
paintScrolled();
document.documentElement.setAttribute("data-view","wide");
setMode(LOCKED ? "client" : "review");
</script>
